<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Pineapple Design Systems — presentational React components on Radix Themes">
  <title>Pineapple Design Systems — presentational React components on Radix Themes</title>
  <!--
    SOURCE for /og-card.png, which is what index.html actually points og:image
    at: link scrapers (Slack, iMessage, Twitter, LinkedIn) do not rasterize SVG,
    so the shipped card has to be a PNG. This file is the thing to edit; the PNG
    is a render of it.

    Regenerate after editing, from apps/site/public/ (one-shot, deliberately not
    a dependency of this workspace — a card redrawn twice a year does not earn a
    build step):

      npx sharp-cli -i og-card.svg -o og-card.png

    Both the geometry and the palette are duplicated from favicon.svg (and from
    apps/site/src/components/PineappleMark.tsx) on purpose: these are static
    artworks, not one shared component, and nothing here is rendered by a
    browser with the theme's custom properties in scope. The hexes are the
    light-appearance values of the Radix steps the component reaches for
    through custom properties — grass 9 (#46a758), amber 9 (#ffc53d), amber 11
    (#ab6400) — so all three pineapples are one pineapple. (Written without
    their leading dashes on purpose: an XML comment may not contain a double
    hyphen, and a file that will not parse renders as nothing.)
  -->
  <rect width="1200" height="630" fill="#FBF5EC" />
  <rect y="618" width="1200" height="12" fill="#ffc53d" />

  <!-- The reframe from favicon.svg, composed onto this card's own placement so
       all three files stay the same drawing. See that file for the geometry. -->
  <g transform="translate(830 190) scale(9.4) translate(-1.7778 -1.2222) scale(1.1111)">
    <g fill="#46a758">
      <path d="M16 2 L19 10 L13 10 Z" />
      <path d="M16 2 L19 10 L13 10 Z" transform="rotate(-40 16 10)" />
      <path d="M16 2 L19 10 L13 10 Z" transform="rotate(40 16 10)" />
    </g>
    <rect
      x="8" y="9" width="16" height="20" rx="7"
      fill="#ffc53d" stroke="#ab6400" stroke-width="1"
    />
    <g clip-path="url(#og-pineapple-body)" fill="#ab6400">
      <use href="#og-pineapple-pip" x="12.5" y="14" />
      <use href="#og-pineapple-pip" x="19.5" y="14" />
      <use href="#og-pineapple-pip" x="10" y="19" />
      <use href="#og-pineapple-pip" x="16" y="19" />
      <use href="#og-pineapple-pip" x="22" y="19" />
      <use href="#og-pineapple-pip" x="12.5" y="24" />
      <use href="#og-pineapple-pip" x="19.5" y="24" />
    </g>
  </g>
  <defs>
    <clipPath id="og-pineapple-body">
      <rect x="8" y="9" width="16" height="20" rx="7" />
    </clipPath>
    <path id="og-pineapple-pip" d="M0 -3 L2.5 0 L0 3 L-2.5 0 Z" />
  </defs>

  <!-- The name sets on TWO lines, and that is forced rather than styled. The
       mark occupies x 813 to 1147 (see its transform above), so the text column
       ends at about 790. "Pineapple Design Systems" is 1114px at font-size 88 —
       it would cross the pineapple and run 2px off the right edge of the card.
       Set on one line it would have to drop to about 55px to clear, which on a
       1200x630 card scraped into a timeline is no longer a headline. Broken
       after "Pineapple" the two lines are ~430px and ~660px, both inside the
       column at the full 88.

       Every baseline below therefore moved up, because the second line is 92px
       the block did not have: the ink now spans y 118 to 508 and centres on
       313, against the card's own 309 and the mark's 345.

       The eyebrow no longer reads "REACT DESIGN SYSTEM": the name under it now
       ends in "Design Systems", and the card would say it twice in two type
       sizes. It names the thing you get instead. -->
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#1F1B16">
    <text x="88" y="135" font-size="24" font-weight="700" letter-spacing="4" fill="#ab6400">
      REACT COMPONENTS
    </text>
    <text x="88" y="233" font-size="88" font-weight="700">Pineapple</text>
    <text x="88" y="325" font-size="88" font-weight="700">Design Systems</text>
    <text x="88" y="393" font-size="32" fill="#6B6157">Thin, typed wrappers over Radix Themes,</text>
    <text x="88" y="437" font-size="32" fill="#6B6157">published under the @pineappleui scope.</text>
    <text x="88" y="501" font-size="26" fill="#94897C">designpineapple.com</text>
  </g>
</svg>
