<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Pineapple Design — presentational React components on Radix Themes">
  <title>Pineapple Design — presentational React components on Radix Themes</title>
  <!--
    SOURCE for /og-card-v2.png, which is what index.html actually points
    og:image at: link scrapers (Slack, iMessage, Twitter, LinkedIn) do not
    rasterize SVG, so the shipped card has to be a PNG. This file is the thing
    to edit; the PNG is a render of it.

    THE OUTPUT IS VERSIONED, and the version is the point. A scraper caches a
    card by its URL and holds it for weeks, storing the fetched BYTES rather
    than re-reading the file — so re-rendering over the same path leaves every
    preview already in the wild showing the old artwork, with no way to ask for
    the new one. A new filename is the whole cache-bust. Deleting the previous
    PNG is free for the same reason: what is cached is the image data, not the
    path. So when the drawing changes materially, render the NEXT version,
    delete the one before it, and update the absolute og:image/twitter:image
    URLs in apps/site/index.html — which cannot follow a rename on their own —
    all in the one commit.

    The render, from apps/site/public/ (one-shot, deliberately not a dependency
    of this workspace — a card redrawn twice a year does not earn a build step),
    with the NEXT version number in the output name — v2 is the one on disk:

      npx sharp-cli -i og-card.svg -o og-card-v3.png

    Both the geometry and the palette are duplicated from favicon.svg (and from
    apps/site/src/components/PineappleMark.tsx) on purpose: these are static
    artworks, not one shared component, and nothing here is rendered by a
    browser with the theme's custom properties in scope. The hexes are the
    light-appearance values of the Radix steps the component reaches for
    through custom properties — grass 9 (#46a758), amber 9 (#ffc53d), amber 11
    (#ab6400) — so all three pineapples are one pineapple. (Written without
    their leading dashes on purpose: an XML comment may not contain a double
    hyphen, and a file that will not parse renders as nothing.)
  -->
  <rect width="1200" height="630" fill="#FBF5EC" />
  <rect y="618" width="1200" height="12" fill="#ffc53d" />

  <!-- The reframe from favicon.svg, composed onto this card's own placement so
       all three files stay the same drawing. See that file for the geometry. -->
  <g transform="translate(830 190) scale(9.4) translate(-1.7778 -1.2222) scale(1.1111)">
    <g fill="#46a758">
      <path d="M16 2 L19 10 L13 10 Z" />
      <path d="M16 2 L19 10 L13 10 Z" transform="rotate(-40 16 10)" />
      <path d="M16 2 L19 10 L13 10 Z" transform="rotate(40 16 10)" />
    </g>
    <rect
      x="8" y="9" width="16" height="20" rx="7"
      fill="#ffc53d" stroke="#ab6400" stroke-width="1"
    />
    <g clip-path="url(#og-pineapple-body)" fill="#ab6400">
      <use href="#og-pineapple-pip" x="12.5" y="14" />
      <use href="#og-pineapple-pip" x="19.5" y="14" />
      <use href="#og-pineapple-pip" x="10" y="19" />
      <use href="#og-pineapple-pip" x="16" y="19" />
      <use href="#og-pineapple-pip" x="22" y="19" />
      <use href="#og-pineapple-pip" x="12.5" y="24" />
      <use href="#og-pineapple-pip" x="19.5" y="24" />
    </g>
  </g>
  <defs>
    <clipPath id="og-pineapple-body">
      <rect x="8" y="9" width="16" height="20" rx="7" />
    </clipPath>
    <path id="og-pineapple-pip" d="M0 -3 L2.5 0 L0 3 L-2.5 0 Z" />
  </defs>

  <!-- The name sets on ONE line, and the size is what pays for it. MEASURE THE
       COLUMN AGAINST THE MARK'S INK, NOT ITS TRANSFORM BOX — getting that wrong
       is what cost this card a type size. The group above is `translate(830)
       scale(9.4)`, so its box runs x 813 to 1147, but the drawing inside spans
       only x 8..24 of a 32-unit viewBox and the rest of that box is empty
       padding. Through the transform, the body's rect edge plus its 5.2px
       half-stroke puts the leftmost INK at 891.6 (the crown's leftmost point is
       926.7, inboard of it) and the rightmost at 1069.2. So a single line
       starting at x 88 has ~803px to the mark's ink, not the 702px this note
       used to claim.

       88 is what the card uses. "Pineapple Design" advances 731.47px at that
       size, ending at x 819.5 with a 72px gutter before the mark's ink — the
       render agrees, its last inked column is 814, the difference being the
       final `n`'s right side bearing. The earlier drop to 84 was measured
       against 813, the transform box, and was never needed: nothing was going to
       touch. For scale, "Pineapple Design Systems" was 1114px at 88, which is
       why THAT name set on two lines of 415px and 675px; breaking a two-word
       name across two lines would read as an accident where the three-word one
       broke at a real seam.

       THE BASELINES DID NOT MOVE for 84 -> 88, and did not need to: the block's
       ink is topped by the eyebrow's cap line and floored by the URL's
       descenders, and the name is neither. Confirmed on the render rather than
       assumed — the text column's ink measures y 159 to 456, centre 307.5, at
       BOTH sizes; only the name row's own extent changes (y 215..291 at 84,
       212..292 at 88), which stays well inside that span.

       Losing the second line at the rename moved the block, but not the way this
       note used to say ("every baseline moved down"): the three rows BELOW the
       name moved UP by 50 (393->343, 437->387, 501->451) and the eyebrow and the
       name moved DOWN by 42 (135->177, 233->275). The net is a re-CENTRING, not
       a shift — nominally y 160 to 458, centring on 309, the card's own centre,
       where the two-line block sat at 313 against the mark's 345. The gaps
       between the rows are unchanged — 98 from the eyebrow to the name, 68 to
       the first sub line, 44 between the sub lines, 64 to the URL — so only the
       block's position moved, not its rhythm.

       The eyebrow still does not read "REACT DESIGN SYSTEM": the name under it
       ends in "Design", so the card would say that word twice in two type sizes.
       It names the thing you get instead. -->
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#1F1B16">
    <text x="88" y="177" font-size="24" font-weight="700" letter-spacing="4" fill="#ab6400">
      REACT COMPONENTS
    </text>
    <text x="88" y="275" font-size="88" font-weight="700">Pineapple Design</text>
    <text x="88" y="343" font-size="32" fill="#6B6157">Thin, typed wrappers over Radix Themes,</text>
    <text x="88" y="387" font-size="32" fill="#6B6157">published under the @pineappleui scope.</text>
    <text x="88" y="451" font-size="26" fill="#94897C">designpineapple.com</text>
  </g>
</svg>
