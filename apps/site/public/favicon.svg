<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Pineapple UI">
  <title>Pineapple UI</title>
  <!--
    The SAME drawing as apps/site/src/components/PineappleMark.tsx — three flat
    layers, no gradients and no opacity, so it survives 16px: a three-blade
    crown from one rotated triangle, one rounded body painted over it, and seven
    diamond pips clipped to that body. Edit one and edit the other; the site's
    header and its tab icon showing two different pineapples is the failure this
    duplication has to be watched for.

    Colours are literal hex on purpose — a favicon is fetched outside the
    document, so no CSS custom property (and therefore no design token) is in
    scope by the time it paints. They are the light-appearance values of the
    three Radix steps the component reaches for through custom properties —
    grass 9 (#46a758), amber 9 (#ffc53d) and amber 11 (#ab6400) — which are
    saturated enough to hold on both light and dark tab chrome. (Written
    without their leading dashes on purpose: an XML comment may not contain a
    double hyphen, and a file that will not parse renders as nothing.)

    This file is the source for the sibling favicon.ico, which exists for the
    bare /favicon.ico request that agents make without reading the document.
    To regenerate it after editing (one-shot, no dependency and no build step —
    a mark redrawn twice a year does not earn either): render this file at 16,
    32 and 48 px with `npx sharp-cli`, whose density flag takes 36, 72 and 108
    respectively (this viewBox is 32 units, and the default density is 72 dpi,
    so each size renders natively rather than being resampled), then wrap the
    three PNGs unmodified in an ICO container. Do not reach for `npx
    png-to-ico`: it pads the file to 285 kB with a BMP-encoded 256 px entry
    upscaled from the largest input.
  -->
  <defs>
    <clipPath id="pineapple-body">
      <rect x="8" y="9" width="16" height="20" rx="7" />
    </clipPath>
    <path id="pineapple-pip" d="M0 -3 L2.5 0 L0 3 L-2.5 0 Z" />
  </defs>

  <!-- Crown first, body over it: the blade bases tuck under the body's edge. -->
  <g fill="#46a758">
    <path d="M16 2 L19 10 L13 10 Z" />
    <path d="M16 2 L19 10 L13 10 Z" transform="rotate(-40 16 10)" />
    <path d="M16 2 L19 10 L13 10 Z" transform="rotate(40 16 10)" />
  </g>

  <rect x="8" y="9" width="16" height="20" rx="7" fill="#ffc53d" />

  <!-- The outer pips of the middle row overhang the body; the clip shaves them,
       which is what makes the lattice follow the curve instead of stopping
       short of it in a straight line. -->
  <g clip-path="url(#pineapple-body)" fill="#ab6400">
    <use href="#pineapple-pip" x="12.5" y="14" />
    <use href="#pineapple-pip" x="19.5" y="14" />
    <use href="#pineapple-pip" x="10" y="19" />
    <use href="#pineapple-pip" x="16" y="19" />
    <use href="#pineapple-pip" x="22" y="19" />
    <use href="#pineapple-pip" x="12.5" y="24" />
    <use href="#pineapple-pip" x="19.5" y="24" />
  </g>
</svg>
