name: CI

# One job, no `paths:` filters, on purpose.
#
# A `paths:` allowlist is a silent failure by construction: add a source tree
# that no pattern matches and the job never runs, a job that never runs reports
# no check, and the PR is green because nothing looked at it. One unfiltered
# `turbo run` over the whole workspace means a new package is covered the day
# it is added — no workflow edit, nothing to remember.
#
# The cost this buys back is small: turbo hashes its own inputs, so a docs-only
# commit restores every task from cache in seconds.
on:
  push:
    branches: [main]
  pull_request:

# A new commit on a PR cancels that PR's in-flight run. Keyed on the PR number
# so PRs never cancel each other; pushes to main fall back to the ref and are
# never cancelled, so every commit that lands on main stays verified.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    env:
      TURBO_CACHE_DIR: .turbo/cache

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # `changeset status --since=origin/main` needs the full history to
          # diff against the base branch.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # Runners ship npm 10, but the root manifest declares
      # devEngines.packageManager npm ^11.0.0. onFail is `warn`, so the mismatch
      # failed nothing and simply logged EBADDEVENGINES under every npm step —
      # noise that trains readers to skim npm's output, which is where a real
      # warning would then hide. Fixed here rather than by relaxing the
      # declaration: the repo means npm 11, so CI should run npm 11.
      #
      # `npm --version` is printed, not assumed: it is the one line that proves
      # which package manager actually ran, and it keeps that evidence in every
      # future run rather than only in the PR that introduced this step.
      #
      # One EBADDEVENGINES source survives this step and is structural:
      # `Set up Node` runs npm before it can be upgraded. Turbo replaying the
      # stored stdout of npm 10 cache entries was a second source; the salt on
      # the cache key below discards those entries.
      - name: Install npm 11 to match devEngines.packageManager
        run: |
          npm install -g npm@11
          npm --version

      # Persists turbo's local cache between runs. Turbo hashes its own inputs,
      # so a stale restore is safe — any real change recomputes.
      #
      # The `npm11` segment is a cache salt. A cache hit replays the task's
      # recorded stdout verbatim, so entries computed under npm 10 kept
      # reprinting ~140 EBADDEVENGINES warnings even after the step above
      # started running npm 11 — and they do not fade with time: this branch
      # changed package-lock.json and the sibling packages replayed anyway.
      # That is worse than noise, because a genuinely new warning (a
      # devEngines bump to ^12, say) would be indistinguishable from replay.
      # The salt drops the npm 10 entries; the cost is one cold run.
      #
      # It is in `key` AND in `restore-keys` deliberately. Salting only `key`
      # is inert — the unsalted `restore-keys` prefix still matches every old
      # entry, so the cache restores exactly as before and the salt changes
      # nothing without failing anything. That is the silent no-op this PR
      # exists to remove, so if either line is ever re-salted, re-salt both.
      #
      # `apps/**` joined the hashed set with the gallery workspace. A new source
      # tree that no pattern here matches is not a wrong answer — turbo re-hashes
      # its own inputs, so a stale restore still recomputes — but it is a key that
      # never changes when that tree does, which is one more place a new workspace
      # can be invisible to the thing meant to see it.
      - name: Restore turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-npm11-${{ runner.os }}-${{ hashFiles('packages/**/src/**', 'packages/**/package.json', 'apps/**', 'package-lock.json', 'turbo.json') }}
          restore-keys: |
            turbo-npm11-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      # Before the build, not after: this asserts that the lockfile still gives
      # each root-declared toolchain package the top `node_modules/` slot. A
      # slot that changed hands downgrades the toolchain every step below runs
      # on — silently, since a hoisted downgrade breaks no install and fails no
      # test. Knowing that first is what makes the rest of this job meaningful.
      - name: Check the toolchain owns its hoist slots
        run: node scripts/check-toolchain-hoist.mjs

      # Also before the build, and for the same kind of reason: it reads configs
      # only, and the drift it catches is one that makes the build below MEAN
      # less. A package missing from the gallery's devDependencies has no turbo
      # edge, so a story edit does not change the gallery build's hash and the
      # step after this replays a cached build that never compiled the edit —
      # green, in the ordinary way, having looked at nothing.
      - name: Check the gallery's alias fences agree
        run: node scripts/check-alias-fences.mjs

      # No --filter: every workspace, every task. This is the line that makes a
      # newly added package covered without touching this file.
      #
      # Turbo silently skips a task a package omits, so this step alone cannot
      # tell "all green" from "nothing ran". The publish-contract step below is
      # what closes that: every workspace — private ones too — must define all
      # four scripts or declare each omission with a reason in its manifest.
      - name: Build, lint, test, typecheck
        run: npx turbo run build lint test typecheck

      # After the build: the tarball assertion reads dist/.
      - name: Check publish contract
        run: node scripts/check-publish-contract.mjs

      # Also after the build: the guard reads the vocabulary it enforces from the
      # built tokens package, so it cannot disagree with the package it checks.
      #
      # Its own step rather than a line in the one above, so a failure names which
      # invariant broke — a hard-coded list is a different problem with a different
      # fix from a malformed manifest.
      - name: Check for hard-coded token lists
        run: node scripts/check-token-drift.mjs

      # Also after the build: three of its five assertions read dist/, because
      # what tsup was asked to externalise and what it actually emitted are
      # different facts. An inlined React is a duplicate copy that only fails in
      # the CONSUMER's app, so nothing downstream of here would ever report it.
      - name: Check peers stayed external
        run: node scripts/check-peer-externals.mjs

      # A PR that changes a publishable package without a changeset ships no
      # release. Only meaningful on a PR, where there is a base to diff against.
      - name: Check for a changeset
        if: github.event_name == 'pull_request'
        run: npx changeset status --since=origin/main
